---
name: hq
synopsis: haskell query - a JSON processor inspired by jq
version: 0.0.0.1

license: MIT

library:
  source-dirs: ./src/
  dependencies:
    - aeson
    - base
    - data-fix
    - free
    - json-stream
    - megaparsec
    - optparse-applicative
    - relude
    - scientific
    - text
    - vector

ghc-options:
  - -fwrite-ide-info
  - -Wall
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wpartial-fields
  - -Widentities
  - -Wredundant-constraints
  - -Wcpp-undef
  - -Wunused-packages

executables:
  hq:
    main: Main.hs
    source-dirs: ./app/
    ghc-options:
      - -rtsopts
      - -threaded
      - -with-rtsopts=-N
    dependencies:
      - base
      - hq
      - optparse-applicative
      - relude

tests:
  hq-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -rtsopts
      - -threaded
      - -with-rtsopts=-N
    dependencies:
      - base
      - data-fix
      - free
      - hq
      - relude
      - sydtest
      - sydtest-discover
      - vector
