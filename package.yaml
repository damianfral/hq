---
name: hq
synopsis: haskell query - a JSON processor inspired by jq
version: 0.0.0.1

license: MIT

library:
  source-dirs: ./src/
  dependencies:
    - aeson
    - base
    - data-fix
    - free
    - megaparsec
    - mtl
    - optparse-applicative
    - relude
    - scientific
    - streaming
    - text
    - transformers
    - vector

ghc-options:
  - -O2
  - -fshow-warning-groups
  - -Werror
  - -Wall
  - -Wcompat
  - -Wcpp-undef
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wpartial-fields
  - -Wredundant-constraints
  - -fwrite-ide-info
  - -funbox-strict-fields
  - -flate-dmd-anal
  - -fno-omit-interface-pragmas
  - -fregs-graph
  - -fspec-constr-recursive=32
  - -fmax-worker-args=32

executables:
  hq:
    main: Main.hs
    source-dirs: ./app/
    ghc-options:
      - -rtsopts
      - -threaded
      - -with-rtsopts=-qg
      - -O2
    dependencies:
      - base
      - hq
      - optparse-applicative
      - relude

tests:
  hq-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -rtsopts
      - -threaded
      - -with-rtsopts=-N
      - -O2
    dependencies:
      - aeson
      - base
      - bytestring
      - data-fix
      - free
      - hq
      - megaparsec
      - mtl
      - optparse-applicative
      - relude
      - scientific
      - streaming
      - sydtest
      - sydtest-discover
      - vector
